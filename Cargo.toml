[package]
name = "webhook-buffer"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8"
bytes = "1.12.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2"] }
rusqlite = { version = "0.41.0", features = ["bundled"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
