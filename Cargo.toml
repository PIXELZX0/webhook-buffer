[package]
name = "webhook-buffer"
version = "0.1.3"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8"
bytes = "1.12.1"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2"] }
rusqlite = { version = "0.41.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.release]
# 바이너리를 작게 만들어 메모리에 올라가는 코드 크기를 줄인다.
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
